[package]
name = "speet-recompile"
version = "0.1.0"
edition = "2021"
description = "Full-binary recompiler driver: load host binary -> speet (WASM) -> wasm-blitz (native) -> object -> system link."

[dependencies]
binary-io = { path = "../../../../binary-io" }
tunnel = { path = "../../../../tunnel" }
speet-host-api = { path = "../speet-host-api" }
speet-host-mem-shim = { path = "../speet-host-mem-shim", optional = true }
speet-abi-stubs = { path = "../speet-abi-stubs" }
speet-rt = { path = "../speet-rt", optional = true }

# wasm-blitz backends — optional so `speet-recompiler-guest` can compile the
# frontend to wasm32 without pulling native codegen.
portal-solutions-blitz-aarch64 = { path = "../../../../wasm-blitz/crates/blitz-aarch64", optional = true }
portal-solutions-blitz-x86-64 = { path = "../../../../wasm-blitz/crates/blitz-x86-64", optional = true }
portal-solutions-blitz-riscv32 = { path = "../../../../wasm-blitz/crates/blitz-riscv32", optional = true }
portal-solutions-blitz-arm = { path = "../../../../wasm-blitz/crates/blitz-arm", optional = true }
portal-solutions-blitz-i686 = { path = "../../../../wasm-blitz/crates/blitz-i686", optional = true }
portal-solutions-blitz-c = { path = "../../../../wasm-blitz/crates/blitz-c", optional = true }
portal-solutions-blitz-js = { path = "../../../../wasm-blitz/crates/blitz-js", optional = true }
portal-solutions-blitz-common = { path = "../../../../wasm-blitz/crates/blitz-common", features = ["asm"], optional = true }
portal-solutions-asm-aarch64 = { path = "../../../../asm-arch/crates/asm-aarch64", features = ["bin-backend"], optional = true }
portal-solutions-asm-x86-64 = { path = "../../../../asm-arch/crates/asm-x86-64", features = ["iced"], optional = true }
portal-solutions-asm-riscv32 = { path = "../../../../asm-arch/crates/asm-riscv32", features = ["rv-asm-backend"], optional = true }
portal-solutions-asm-arm = { path = "../../../../asm-arch/crates/asm-arm", features = ["bin-backend"], optional = true }
portal-solutions-asm-x86 = { path = "../../../../asm-arch/crates/asm-x86", features = ["iced"], optional = true }

# speet frontend (native machine code -> WASM)
speet-x86_64 = { path = "../../native/speet-x86_64" }
speet-x86 = { path = "../../native/speet-x86" }
speet-aarch64 = { path = "../../native/speet-aarch64" }
speet-arm = { path = "../../native/speet-arm" }
speet-riscv = { path = "../../native/speet-riscv", features = ["logging"] }
speet-syscall = { path = "../speet-syscall" }
speet-host-syscall = { path = "../speet-host-syscall" }
speet-linux-wasi = { path = "../speet-linux-wasi" }
speet-link-core = { path = "../speet-link-core" }
speet-plugin-api = { path = "../../plugin/speet-plugin-api" }
speet-plugin-adapter = { path = "../../plugin/speet-plugin-adapter" }
speet-log = { path = "../../helper/speet-log", features = ["log-subscriber"] }
speet-memory = { path = "../../helper/speet-memory" }
speet-reach = { path = "../../helper/speet-reach" }
yecta = { path = "../../helper/yecta" }
rv-asm = { version = "*", git = "https://github.com/portal-co/rv-utils.git" }
wasm-encoder = { version = "0.240.0", features = ["wasmparser"] }
wasmparser = "0.240.0"

[features]
default = ["native-backend"]
native-backend = [
    "dep:speet-host-mem-shim",
    "dep:speet-rt",
    "dep:portal-solutions-blitz-aarch64",
    "dep:portal-solutions-blitz-x86-64",
    "dep:portal-solutions-blitz-riscv32",
    "dep:portal-solutions-blitz-arm",
    "dep:portal-solutions-blitz-i686",
    "dep:portal-solutions-blitz-c",
    "dep:portal-solutions-blitz-js",
    "dep:portal-solutions-blitz-common",
    "dep:portal-solutions-asm-aarch64",
    "dep:portal-solutions-asm-x86-64",
    "dep:portal-solutions-asm-riscv32",
    "dep:portal-solutions-asm-arm",
    "dep:portal-solutions-asm-x86",
]

[dev-dependencies]
speet-runtime = { path = "../speet-runtime" }
