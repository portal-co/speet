[package]
name = "speet-runtime"
version = "0.1.0"
edition = "2021"
description = "Thin runtime driver: recompile guest binaries to native and spawn via tunneled HostApi."

[dependencies]
binary-io = { path = "../../../../binary-io" }
speet-host-api = { path = "../speet-host-api" }
speet-abi-stubs = { path = "../speet-abi-stubs" }
speet-host-syscall = { path = "../speet-host-syscall" }
speet-recompile = { path = "../speet-recompile" }
speet-riscv = { path = "../../native/speet-riscv" }
speet-rt = { path = "../speet-rt" }
tunnel = { path = "../../../../tunnel" }
object = "0.36"
wasmparser = "0.240.0"
os-transform-core = { path = "../../../../os-emulation/crates/daemon/os-transform-core" }
os-daemon-protocol = { path = "../../../../os-emulation/crates/daemon/os-daemon-protocol" }
os-daemon-hook = { path = "../../../../os-emulation/crates/daemon/os-daemon-hook" }
os-daemon = { path = "../../../../os-emulation/crates/daemon/os-daemon" }
os-shim-core = { path = "../../../../os-emulation/crates/shim/os-shim-core", features = ["daemon"] }

[dev-dependencies]
tempfile = "3"
speet-program-equivalence = { path = "../../test/speet-program-equivalence" }
speet-guest-runner = { path = "../../test/speet-guest-runner" }
speet-corpus-harness = { path = "../../test/speet-corpus-harness" }
speet-recompile = { path = "../speet-recompile" }
speet-host-api = { path = "../speet-host-api" }

[build-dependencies]
