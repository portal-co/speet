[package]
name = "speet-e2e"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
wasmi = "1"
object = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rv-asm.workspace = true
speet-riscv = { path = "../../native/speet-riscv" }
speet-x86_64 = { path = "../../native/speet-x86_64" }
speet-aarch64 = { path = "../../native/speet-aarch64" }
speet-mips = { path = "../../native/speet-mips" }
rabbitizer.workspace = true
speet-link-core = { path = "../../os/speet-link-core" }
speet-traps = { path = "../../helper/speet-traps" }
speet-module-builder = { path = "../../os/speet-module-builder" }
speet-linker = { path = "../../os/speet-linker" }
speet-memory = { path = "../../helper/speet-memory" }
wasm-encoder.workspace = true
wasmparser = { version = "0.240.0", features = ["validate"] }
yecta = { path = "../../helper/yecta" }
wasm-layout = { path = "../../helper/wasm-layout" }
speet-wasm = { path = "../../managed/speet-wasm" }
speet-linux-wasi = { path = "../../os/speet-linux-wasi" }
speet-darwin-wasi = { path = "../../os/speet-darwin-wasi" }
speet-plugin-api = { path = "../../plugin/speet-plugin-api" }
speet-syscall = { path = "../../os/speet-syscall" }
# Native backend (wasm-blitz) for the wasm-vs-native cross tests; re-exports binary-io.
speet-recompile = { path = "../../os/speet-recompile" }
speet-host-api = { path = "../../os/speet-host-api" }
wasmtime = "45.0.2"

# Lane B-native dual-lane tests (thin runtime) — macOS only.
[target.'cfg(target_os = "macos")'.dev-dependencies]
speet-runtime = { path = "../../os/speet-runtime" }
binary-io = { path = "../../../../binary-io" }
