[package]
name = "speet-diff-core"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../../COPYING.md"
description = "Comparison (differential) fuzzing core: random cases run under Unicorn and the speet recompiled output, with divergence comparison — see docs/comparison-fuzzing-plan.md"

[features]
# Unicorn oracle (test-only dependency; disable to build everything else).
default = ["oracle"]
oracle = ["dep:unicorn-engine"]
proptest = ["dep:proptest"]

[dependencies]
speet-corpus-harness = { path = "../speet-corpus-harness" }
speet-recompile = { path = "../../os/speet-recompile" }
speet-link-core = { path = "../../os/speet-link-core" }
speet-memory = { path = "../../helper/speet-memory" }
yecta = { path = "../../helper/yecta" }
speet-x86_64 = { path = "../../native/speet-x86_64" }
speet-host-api = { path = "../../os/speet-host-api" }
iced-x86 = "1.21"
wasm-encoder = { workspace = true }
wasmparser = { workspace = true, features = ["validate"] }
wasmi = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = { version = "1", optional = true }
unicorn-engine = { version = "2.1.5", optional = true, default-features = false, features = ["arch_x86"] }

[dev-dependencies]
proptest = "1"
